<!doctype html>
<html><head><meta charset="utf-8"><title>FreeAir TV banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=block" rel="stylesheet">
<style>
  /* Drawn at 640x360; rendered at 0.5x for the 320x180 Fire TV banner. */
  html,body{margin:0;width:640px;height:360px;overflow:hidden}
  body{background:linear-gradient(135deg,#00D2A8 0%,#0EA5E9 50%,#2563EB 100%);font-family:"Plus Jakarta Sans",sans-serif;color:#fff}
  .b{height:360px;display:flex;align-items:center;gap:12px;padding:0 32px;box-sizing:border-box}
  img{width:320px;height:320px;flex:none}
  .name{white-space:nowrap;font-weight:800;font-size:58px;letter-spacing:-0.035em;line-height:1}
  .name span{font-weight:500}
</style></head>
<body><div class="b"><img src="freeair-mark.svg" alt=""><div class="name">FreeAir <span>TV</span></div></div></body></html>
