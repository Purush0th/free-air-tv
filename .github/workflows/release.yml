# Builds, signs and publishes FreeAir TV when a version tag is pushed:
#   git tag v1.1.0 && git push origin v1.1.0
# Installed copies find the release within about 12 hours and offer to update.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded
#   KEYSTORE_PASSWORD  its password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export VERSION="${VERSION#v}"
          chmod +x build.sh
          ./build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/FreeAirTV-*.apk build/FreeAirTV-*.apk.sha256 \
            --title "FreeAir TV ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
