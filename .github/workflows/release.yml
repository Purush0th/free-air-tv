# Builds, signs and publishes FreeAir TV for Android (Fire TV) when an Android version tag
# is pushed:
#   git tag android-v1.1.15 && git push origin android-v1.1.15
# Roku releases use roku-v* tags (roku-release.yml). Plain v* tags are the older Android
# scheme, still built here for the bridge release that teaches installed apps the new tags.
# Installed apps find the release within about 12 hours and offer to update.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded
#   KEYSTORE_PASSWORD  its password
name: Android release

on:
  push:
    tags: ['android-v*', 'v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          VERSION="${TAG#android-}"
          export VERSION="${VERSION#v}"
          chmod +x build.sh
          ./build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#android-}"
          VERSION="${VERSION#v}"
          # Marked latest: apps from 1.1.13 and earlier look only at the latest release.
          gh release create "$TAG" build/FreeAirTV-android-*.apk build/FreeAirTV-android-*.apk.sha256 \
            --title "FreeAir TV for Android $VERSION" --latest --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
